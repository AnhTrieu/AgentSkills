name: Bootstrap skill validation
on:
  workflow_dispatch:
  push:
    paths:
      - Codex/bootstrap-project/**
      - .github/workflows/bootstrap-skill.yml
  pull_request:
    paths:
      - Codex/bootstrap-project/**
      - .github/workflows/bootstrap-skill.yml
permissions:
  contents: read
concurrency:
  group: bootstrap-skill-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '10.20.0'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.9.5'
      - name: Helper and preservation tests
        working-directory: Codex/bootstrap-project
        run: uv run python -m unittest discover -s tests -v
      - name: Real install, checks, and repeat-plan matrix
        working-directory: Codex/bootstrap-project
        run: uv run python scripts/test_profiles.py --output profile-results.json
